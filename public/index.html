<html lang="pt">
<head>
  <meta charset="UTF-8">

  <title>PALCORE Decision Partner — Parceiro de decisao com IA</title>
  <meta name="description" content="Gera prompts estruturadas ou pede ajuda directa a IA para tomar decisoes. Ferramenta gratuita PALCORE.">
  <meta property="og:title" content="PALCORE Decision Partner v1.1 — Arena Mode">

<body>
  <div id="root"></div>
  <script>
  /**
   * PALCORE Decision Partner v1.0

   * NIPC 517959682 | ORCID 0009-0003-8071-9890

  var useState = React.useState;
  var useCallback = React.useCallback;
  var useRef = React.useRef;
  var e = React.createElement;

  var API_ENDPOINT = "/api/decision";
  var ARENA_ENDPOINT = "/api/arena";

  function buildPrompt(tema, contexto) {
    return "Atua como meu parceiro de decisao: rigoroso, didatico, direto e factual.\n" +
      "Tema: " + tema + ". Contexto: " + contexto + ".\n\n" +
      "Regras:\n" +
      "- PT-PT, sem frases genericas.\n" +
      "- Nao inventes. Se faltar dado, diz \"sem dados suficientes\" e pergunta.\n" +
      "- Prioriza impacto real (economico, estrategico ou emocional).\n" +
      "- Resposta total: 220-300 palavras.\n\n" +
      "Ordem:\n" +
      "1) Faz 5 perguntas cirurgicas (curtas, nao genericas).\n" +
      "2) Depois das minhas respostas, entrega:\n" +
      "   - Problema real (1 frase)\n" +
      "   - Oportunidade escondida (1 frase)\n" +
      "   - Erro mais provavel (1 frase)\n" +
      "3) Plano:\n" +
      "   - HOJE (24h): 3 acoes\n" +
      "   - 30 DIAS: 3 marcos\n" +
      "   - 6 MESES: cenario realista\n" +
      "4) Se couber nas 300 palavras, traduz para:\n" +
      "   - metafora clara\n" +
      "   - checklist simples\n" +
      "   - mantra (1 linha)\n" +
      "5) Fecha com:\n" +
      "\"Se so fizesses UMA coisa nas proximas 24h, seria isto: [acao].\"\n\n" +
      "Criterio de qualidade (auto-check):\n" +
      "Especifica? Executavel em 24h? Mensuravel? Adequada ao meu contexto?\n" +
      "Se algum for \"nao\", refaz mais simples.";
  }

  // ── Focus Meter Algorithm (inline from palcore-focus-meter) ──
  var PT_STOPWORDS = new Set(["para","como","mais","este","esta","esse","essa","isso","aqui","onde","quando","porque","qual","quais","cada","muito","menos","tambem","ainda","mesmo","toda","todo","todos","todas","pode","podem","deve","devem","sido","sendo","seria","foram","tinha","tenho","tens","dele","dela","deles","delas","pela","pelo","pelos","sobre","entre","depois","antes","desde","durante","the","and","that","this","with","from","your","have","been","will","would","could","should","they","them","their","there","these","those","which","about","into","also","some","than","then","what","when","where"]);
  var FILLER_PATTERNS = ["e importante notar","vale a pena mencionar","it's worth noting","it's important to","let me know if","hope this helps","feel free to","don't hesitate","happy to help","glad you asked","great question","that's a great","absolutely","certainly","of course","como mencionei","como referi","espero que ajude","nao hesites","fico feliz","boa pergunta","excelente questao","sem duvida","com certeza","genuinely","honestly","straightforward","i'd be happy to","as an ai","i understand","that said","in summary","como ia","dito isto","it is important","it is worth","i hope this"];
  var FM_CRITERIA = [
    { id: "length", label: "Concisao", icon: "\u{1F4CF}" },
    { id: "offTopic", label: "Foco", icon: "\u{1F3AF}" },
    { id: "repetition", label: "Repeticao", icon: "\u{1F501}" },
    { id: "filler", label: "Palha", icon: "\u{1F33E}" },
  ];
  function fmNormalize(t) { return t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(); }
  function fmAnalyze(text, question) {
    var sc = {}, nt = {}, norm = fmNormalize(text), wc = text.split(/\s+/).filter(function(w){return w.length>0;}).length, ch = text.length;
    var sents = text.split(/[.!?]+/).filter(function(s){return s.trim().length>0;});
    // Concisao
    if(ch<=400){sc.length=100;nt.length=wc+" palavras";}else if(ch<=800){sc.length=85;nt.length=wc+" palavras";}else if(ch<=1500){sc.length=60;nt.length=wc+" palavras";}else{sc.length=Math.max(20,60-Math.floor((ch-1500)/100)*5);nt.length=wc+" palavras";}
    // Foco
    if(question&&question.trim().length>10){var qW=fmNormalize(question).split(/\s+/).filter(function(w){return w.length>3&&!PT_STOPWORDS.has(w);});var rN=fmNormalize(text);var m=qW.filter(function(w){return rN.includes(w);});var r=qW.length>0?m.length/qW.length:1;if(r>=0.5){sc.offTopic=100;nt.offTopic="Alinhado";}else if(r>=0.25){sc.offTopic=70;nt.offTopic="Algum desvio";}else{sc.offTopic=40;nt.offTopic="Desalinhado";}}else{sc.offTopic=null;nt.offTopic="n/a";}
    // Repeticao
    var sT=sents.map(function(s){return fmNormalize(s.trim());});var rC=0;for(var i=0;i<sT.length;i++){for(var j=i+1;j<sT.length;j++){var wA=sT[i].split(/\s+/).filter(function(w){return w.length>3;});var wB=sT[j].split(/\s+/).filter(function(w){return w.length>3;});if(wA.length<5||wB.length<5)continue;var ov=wA.filter(function(w){return wB.includes(w);});if(ov.length/Math.min(wA.length,wB.length)>0.5)rC++;}}
    if(rC===0){sc.repetition=100;nt.repetition="Sem repeticoes";}else if(rC<=2){sc.repetition=70;nt.repetition=rC+" repeticao(oes)";}else{sc.repetition=Math.max(20,70-rC*15);nt.repetition=rC+" repeticoes";}
    // Palha
    var ff=FILLER_PATTERNS.filter(function(p){return norm.includes(p);});if(ff.length===0){sc.filler=100;nt.filler="Zero palha";}else if(ff.length<=2){sc.filler=75;nt.filler=ff.length+" expressao(oes)";}else{sc.filler=Math.max(15,75-ff.length*12);nt.filler=ff.length+" expressoes";}
    var vs=Object.values(sc).filter(function(s){return s!==null;});var gl=vs.length>0?Math.round(vs.reduce(function(a,b){return a+b;},0)/vs.length):0;
    return {scores:sc,notes:nt,global:gl,words:wc};
  }

  // ── Mini Focus Meter UI Components ──
  function MiniScoreRing(props) {
    var v=props.value,sz=props.size||56,r=(sz-8)/2,c=2*Math.PI*r,off=c-(v/100)*c;
    var col=v>=85?"#00E676":v>=60?"#FFD600":v>=40?"#FF9100":"#FF1744";
    return e("div",{style:{position:"relative",width:sz,height:sz,flexShrink:0}},
      e("svg",{width:sz,height:sz,style:{transform:"rotate(-90deg)"}},
        e("circle",{cx:sz/2,cy:sz/2,r:r,fill:"none",stroke:"rgba(255,255,255,0.08)",strokeWidth:"4"}),
        e("circle",{cx:sz/2,cy:sz/2,r:r,fill:"none",stroke:col,strokeWidth:"4",strokeDasharray:c,strokeDashoffset:off,strokeLinecap:"round",style:{transition:"stroke-dashoffset 0.6s ease"}})
      ),
      e("div",{style:{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}},
        e("span",{style:{fontSize:sz*0.32,fontWeight:800,color:col,fontFamily:"'DM Mono',monospace"}},v))
    );
  }
  function MiniScoreBar(props) {
    var col=props.score===null?"#555":props.score>=85?"#00E676":props.score>=60?"#FFD600":props.score>=40?"#FF9100":"#FF1744";
    return e("div",{style:{display:"flex",alignItems:"center",gap:6,marginBottom:4}},
      e("span",{style:{fontSize:10,color:"rgba(255,255,255,0.5)",width:16,textAlign:"center"}},props.icon),
      e("div",{style:{flex:1,height:4,borderRadius:2,background:"rgba(255,255,255,0.06)",overflow:"hidden"}},
        e("div",{style:{height:"100%",width:props.score===null?"0%":props.score+"%",background:col,borderRadius:2,transition:"width 0.5s ease"}})),
      e("span",{style:{fontSize:10,fontWeight:700,color:col,fontFamily:"'DM Mono',monospace",width:28,textAlign:"right"}},props.score===null?"--":props.score)
    );
  }
  function FocusScoreCard(props) {
    var r=props.result;if(!r)return null;
    return e("div",{style:{display:"flex",gap:12,alignItems:"center",marginTop:12,padding:"10px 12px",background:"rgba(255,255,255,0.02)",borderRadius:8,border:"1px solid rgba(255,255,255,0.05)"}},
      e(MiniScoreRing,{value:r.global,size:50}),
      e("div",{style:{flex:1}},FM_CRITERIA.map(function(c){return e(MiniScoreBar,{key:c.id,icon:c.icon,score:r.scores[c.id]});}))
    );
  }

  var EXAMPLES = [
    { label: "Carreira", tema: "Mudanca de carreira", ctx: "10 anos na mesma empresa, sem progressao ha 3." },
    { label: "Negocio", tema: "Lancar produto digital", ctx: "Tenho audiencia pequena (500 seguidores) e um prototipo funcional." },
    { label: "Projecto", tema: "Certificacao tecnica", ctx: "Exame em 3 semanas, nunca fiz certificacao antes, aprendo na pratica." },
    { label: "Financas", tema: "Investimento imobiliario", ctx: "50k disponiveis, mercado em correccao, primeira compra para investimento." },
  ];

  function TypingDots() {
    return e("span", { style: { display: "inline-flex", gap: 3, alignItems: "center" } },
      [0, 1, 2].map(function(i) {
        return e("span", { key: i, style: { width: 6, height: 6, borderRadius: "50%", background: "#E94560", animation: "pulse 1.2s ease-in-out " + (i * 0.2) + "s infinite" } });
      })
    );
  }

  function TabButton(props) {
    return e("button", { onClick: props.onClick, style: {
      flex: 1, padding: "12px 0", fontSize: 13, fontWeight: props.active ? 700 : 500,
      letterSpacing: 0.5, color: props.active ? "#fff" : "rgba(255,255,255,0.4)",
      background: props.active ? "rgba(233,69,96,0.15)" : "transparent",
      border: "none", borderBottom: props.active ? "2px solid #E94560" : "2px solid transparent",
      cursor: "pointer", transition: "all 0.2s", fontFamily: "inherit", textTransform: "uppercase"
    } }, props.children);
  }

  function InputField(props) {
    var isTextarea = (props.rows || 1) > 1;
    var tag = isTextarea ? "textarea" : "input";
    var fieldProps = {
      value: props.value,
      onChange: function(ev) { props.onChange(ev.target.value); },
      placeholder: props.placeholder,
      maxLength: props.maxLength,
      style: {
        width: "100%", background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.08)",
        borderRadius: 10, color: "#fff", padding: "12px 14px", fontSize: 15, resize: isTextarea ? "vertical" : "none",
        fontFamily: "'Outfit', sans-serif", outline: "none", boxSizing: "border-box", lineHeight: 1.5, transition: "border-color 0.2s"
      }
    };
    if (isTextarea) fieldProps.rows = props.rows;

    return e("div", { style: { marginBottom: 16 } },
      e("label", { style: { fontSize: 11, color: "rgba(255,255,255,0.45)", display: "flex", justifyContent: "space-between", marginBottom: 6, letterSpacing: 1.5, textTransform: "uppercase", fontFamily: "'DM Mono', monospace" } },
        e("span", null, props.label),
        props.maxLength ? e("span", { style: { color: props.value.length > props.maxLength * 0.9 ? "#E94560" : "rgba(255,255,255,0.25)" } }, props.value.length + "/" + props.maxLength) : null
      ),
      e(tag, fieldProps)
    );
  }

  function DecisionPartner() {
    var modeState = useState("generate");
    var mode = modeState[0]; var setMode = modeState[1];
    var temaState = useState("");
    var tema = temaState[0]; var setTema = temaState[1];
    var ctxState = useState("");
    var contexto = ctxState[0]; var setContexto = ctxState[1];
    var promptState = useState("");
    var generatedPrompt = promptState[0]; var setGeneratedPrompt = promptState[1];
    var copiedState = useState(false);
    var copied = copiedState[0]; var setCopied = copiedState[1];
    var aiRespState = useState("");
    var aiResponse = aiRespState[0]; var setAiResponse = aiRespState[1];
    var loadingState = useState(false);
    var aiLoading = loadingState[0]; var setAiLoading = loadingState[1];
    var errorState = useState("");
    var aiError = errorState[0]; var setAiError = errorState[1];
    var convState = useState([]);
    var conversation = convState[0]; var setConversation = convState[1];
    var followState = useState("");
    var followUp = followState[0]; var setFollowUp = followState[1];
    var resultRef = useRef(null);
    // Arena state
    var arenaResState = useState(null);
    var arenaResults = arenaResState[0]; var setArenaResults = arenaResState[1];
    var arenaScState = useState(null);
    var arenaScores = arenaScState[0]; var setArenaScores = arenaScState[1];
    var arenaLoadState = useState(false);
    var arenaLoading = arenaLoadState[0]; var setArenaLoading = arenaLoadState[1];
    var arenaErrState = useState("");
    var arenaError = arenaErrState[0]; var setArenaError = arenaErrState[1];
    var mergeResState = useState(null);
    var mergeResult = mergeResState[0]; var setMergeResult = mergeResState[1];
    var mergeScState = useState(null);
    var mergeScore = mergeScState[0]; var setMergeScore = mergeScState[1];
    var mergeLoadState = useState(false);
    var mergeLoading = mergeLoadState[0]; var setMergeLoading = mergeLoadState[1];

    var canSubmit = tema.trim().length >= 3 && contexto.trim().length >= 10;

    var handleGenerate = useCallback(function() {
      if (!canSubmit) return;
      setGeneratedPrompt(buildPrompt(tema.trim(), contexto.trim()));
      setCopied(false);
      setTimeout(function() { if (resultRef.current) resultRef.current.scrollIntoView({ behavior: "smooth" }); }, 100);
    }, [tema, contexto, canSubmit]);

    var handleCopy = useCallback(function() {
      try { navigator.clipboard.writeText(generatedPrompt); setCopied(true); setTimeout(function() { setCopied(false); }, 2000); }
      catch(err) { /* Clipboard not available */ }
    }, [generatedPrompt]);

    var callAPI = useCallback(function(msgs) {
      setAiLoading(true);
      setAiError("");
      fetch(API_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: msgs }),
      })
      .then(function(res) {
        if (!res.ok) {
          return res.json().then(function(data) { throw new Error(data.error || "Erro " + res.status); });
        }
        return res.json();
      })
      .then(function(data) {
        var text = (data.content || []).filter(function(b) { return b.type === "text"; }).map(function(b) { return b.text; }).join("\n") || "Sem resposta.";
        setAiResponse(text);
        setConversation(msgs.concat([{ role: "assistant", content: text }]));
        setFollowUp("");
        setTimeout(function() { if (resultRef.current) resultRef.current.scrollIntoView({ behavior: "smooth" }); }, 100);
      })
      .catch(function(err) {
        setAiError(err.message || "Erro na ligacao a API. Tenta novamente.");
      })
      .finally(function() {
        setAiLoading(false);
      });
    }, []);

    var handleAI = useCallback(function() {
      if (!canSubmit || aiLoading) return;
      setAiResponse("");
      var msgs = [{ role: "user", content: buildPrompt(tema.trim(), contexto.trim()) }];
      setConversation([]);
      callAPI(msgs);
    }, [tema, contexto, canSubmit, aiLoading, callAPI]);

    var handleFollowUp = useCallback(function() {
      if (!followUp.trim() || aiLoading) return;
      var msgs = conversation.concat([{ role: "user", content: followUp.trim() }]);
      callAPI(msgs);
    }, [followUp, conversation, aiLoading, callAPI]);

    var handleArena = useCallback(function() {
      if (!canSubmit || arenaLoading) return;
      setArenaResults(null); setArenaScores(null); setMergeResult(null); setMergeScore(null); setArenaError(""); setArenaLoading(true);
      var prompt = buildPrompt(tema.trim(), contexto.trim());
      fetch(ARENA_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: [{ role: "user", content: prompt }] }) })
      .then(function(res) { if (!res.ok) return res.json().then(function(d) { throw new Error(d.error || "Erro " + res.status); }); return res.json(); })
      .then(function(data) {
        setArenaResults(data);
        var q = tema.trim() + " " + contexto.trim();
        var scores = {};
        if (data.claude && data.claude.text) scores.claude = fmAnalyze(data.claude.text, q);
        if (data.gpt && data.gpt.text) scores.gpt = fmAnalyze(data.gpt.text, q);
        setArenaScores(scores);
        setTimeout(function() { if (resultRef.current) resultRef.current.scrollIntoView({ behavior: "smooth" }); }, 100);
      })
      .catch(function(err) { setArenaError(err.message || "Erro na Arena."); })
      .finally(function() { setArenaLoading(false); });
    }, [tema, contexto, canSubmit, arenaLoading]);

    var handleMerge = useCallback(function() {
      if (!arenaResults || mergeLoading) return;
      setMergeLoading(true); setMergeResult(null); setMergeScore(null);
      var mergePrompt = "Tens duas respostas ao mesmo problema. Funde numa unica resposta que combine o melhor de ambas. Maximo 300 palavras, PT-PT. Sem mencionar que sao duas respostas separadas — escreve como se fosse a tua propria analise.\n\nResposta A:\n" + (arenaResults.claude?.text || "(indisponivel)") + "\n\nResposta B:\n" + (arenaResults.gpt?.text || "(indisponivel)");
      fetch(API_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: [{ role: "user", content: mergePrompt }] }) })
      .then(function(res) { if (!res.ok) return res.json().then(function(d) { throw new Error(d.error || "Erro " + res.status); }); return res.json(); })
      .then(function(data) {
        var text = (data.content || []).filter(function(b) { return b.type === "text"; }).map(function(b) { return b.text; }).join("\n") || "Sem resposta.";
        setMergeResult(text);
        setMergeScore(fmAnalyze(text, tema.trim() + " " + contexto.trim()));
      })
      .catch(function(err) { setArenaError(err.message); })
      .finally(function() { setMergeLoading(false); });
    }, [arenaResults, mergeLoading, tema, contexto]);

    var handleReset = useCallback(function() {
      setTema(""); setContexto(""); setGeneratedPrompt(""); setAiResponse(""); setAiError(""); setConversation([]); setFollowUp(""); setCopied(false);
      setArenaResults(null); setArenaScores(null); setArenaError(""); setMergeResult(null); setMergeScore(null);
    }, []);

    return e("div", { style: { minHeight: "100vh", background: "#08080d", color: "#f0f0f0", fontFamily: "'Outfit', -apple-system, sans-serif", padding: "20px 16px 40px" } },
      e("div", { style: { maxWidth: 520, margin: "0 auto" } },

        // Header
        e("div", { style: { textAlign: "center", marginBottom: 28 } },
          e("div", { style: { display: "inline-block", fontSize: 10, letterSpacing: 5, color: "#E94560", textTransform: "uppercase", fontWeight: 700, fontFamily: "'DM Mono', monospace", padding: "4px 14px", border: "1px solid rgba(233,69,96,0.25)", borderRadius: 20, marginBottom: 14 } }, "PALCORE"),
          e("h1", { style: { fontSize: 26, fontWeight: 800, margin: "0 0 4px", letterSpacing: -1, background: "linear-gradient(135deg, #fff 40%, rgba(233,69,96,0.7))", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" } }, "Decision Partner"),
          e("p", { style: { fontSize: 13, color: "rgba(255,255,255,0.3)", margin: 0, fontWeight: 300 } }, "O melhor prompt e ser honesto.")
        ),

        // Tabs
        e("div", { style: { display: "flex", borderBottom: "1px solid rgba(255,255,255,0.06)", marginBottom: 24 } },
          e(TabButton, { active: mode === "generate", onClick: function() { setMode("generate"); } }, "Gerar Prompt"),
          e(TabButton, { active: mode === "ai", onClick: function() { setMode("ai"); } }, "Modo IA"),
          e(TabButton, { active: mode === "arena", onClick: function() { setMode("arena"); } }, "Arena")
        ),

        // Quick examples
        e("div", { style: { marginBottom: 20 } },
          e("div", { style: { fontSize: 10, color: "rgba(255,255,255,0.3)", letterSpacing: 2, textTransform: "uppercase", marginBottom: 8, fontFamily: "'DM Mono', monospace" } }, "Exemplos rapidos"),
          e("div", { style: { display: "flex", gap: 6, flexWrap: "wrap" } },
            EXAMPLES.map(function(ex) {
              return e("button", { key: ex.label, onClick: function() { setTema(ex.tema); setContexto(ex.ctx); },
                style: { padding: "6px 12px", fontSize: 12, fontWeight: 500, color: "rgba(255,255,255,0.55)", background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.08)", borderRadius: 20, cursor: "pointer", fontFamily: "inherit", transition: "all 0.15s" } }, ex.label);
            })
          )
        ),

        // Form
